---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: cpu-stress
  namespace: litmus
spec:
  appinfo:
    appns: "staging"
    applabel: "app.kubernetes.io/name in (go-service,node-service,frontend)"
  chaosServiceAccount: litmus-admin
  jobCleanUpPolicy: "delete"
  experiments:
    - name: cpu-hog
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CPU_CORES
              value: "1"
            - name: CPU_PERCENTAGE
              value: "90"
            - name: TARGET_CONTAINER
              value: ""
            - name: LABEL_SELECTOR
              value: "app.kubernetes.io/name in (go-service,node-service,frontend)"
---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: cpu-hog
  namespace: litmus
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
      - apiGroups: ["apps"]
        resources: ["deployments", "replicasets", "horizontalpodautoscalers"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "create", "patch", "update"]
    image: litmuschaos/go-runner:2.13.0
    imagePullPolicy: Always
    args:
      - -c
      - |
        #!/bin/bash
        set -e
        echo "Starting CPU stress chaos experiment"
        echo "CPU Cores: ${CPU_CORES}, CPU Percentage: ${CPU_PERCENTAGE}%"
        echo "Target: $LABEL_SELECTOR in namespace $TARGET_NAMESPACE"
        echo "Duration: ${TOTAL_CHAOS_DURATION}s"

        PODS=$(kubectl get pods -n $TARGET_NAMESPACE -l $LABEL_SELECTOR -o jsonpath='{.items[*].metadata.name}')
        POD_COUNT=$(echo $PODS | wc -w)

        if [ $POD_COUNT -eq 0 ]; then
          echo "No pods found matching selector"
          exit 1
        fi

        echo "Found $POD_COUNT pods"

        # Get HPA info for verification
        HPAS=$(kubectl get hpa -n $TARGET_NAMESPACE -l $LABEL_SELECTOR -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
        if [ -n "$HPAS" ]; then
          echo "Found HPAs: $HPAS - will verify autoscaling"
        fi

        # Start CPU stress on each pod
        for POD in $PODS; do
          CONTAINER=${TARGET_CONTAINER:-$(kubectl get pod $POD -n $TARGET_NAMESPACE -o jsonpath='{.spec.containers[0].name}')}
          echo "Starting CPU stress on pod: $POD, container: $CONTAINER"

          # Use stress-ng or busybox to consume CPU
          kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            sh -c "stress-ng --cpu ${CPU_CORES} --cpu-load ${CPU_PERCENTAGE} --timeout ${TOTAL_CHAOS_DURATION}s &" 2>/dev/null || \
          kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            sh -c "while true; do :; done &" 2>/dev/null || \
          kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            sh -c "dd if=/dev/zero of=/dev/null &" 2>/dev/null || \
          echo "Warning: Could not start CPU stress on $POD (stress-ng not available)"
        done

        echo "CPU stress started. Monitoring for ${TOTAL_CHAOS_DURATION}s..."

        # Monitor HPA scaling
        END_TIME=$(($(date +%s) + TOTAL_CHAOS_DURATION))
        SCALE_EVENTS=0
        while [ $(date +%s) -lt $END_TIME ]; do
          sleep 10
          if [ -n "$HPAS" ]; then
            for HPA in $HPAS; do
              REPLICAS=$(kubectl get hpa $HPA -n $TARGET_NAMESPACE -o jsonpath='{.status.currentReplicas}')
              DESIRED=$(kubectl get hpa $HPA -n $TARGET_NAMESPACE -o jsonpath='{.status.desiredReplicas}')
              if [ "$REPLICAS" != "$DESIRED" ]; then
                echo "HPA $HPA scaling: $REPLICAS -> $DESIRED replicas"
                SCALE_EVENTS=$((SCALE_EVENTS + 1))
              fi
            done
          fi
        done

        echo "CPU stress experiment completed. Scale events: $SCALE_EVENTS"

        # Verify pods are still healthy
        for POD in $PODS; do
          READY=$(kubectl get pod $POD -n $TARGET_NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          if [ "$READY" = "True" ]; then
            echo "Pod $POD is healthy"
          else
            echo "WARNING: Pod $POD is not ready"
          fi
        done
