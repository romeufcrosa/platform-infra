apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: network-latency
  namespace: litmus
spec:
  appinfo:
    appns: "staging"
    applabel: "app.kubernetes.io/name in (go-service,node-service,frontend)"
  chaosServiceAccount: litmus-admin
  jobCleanUpPolicy: "delete"
  experiments:
    - name: network-latency
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: NETWORK_LATENCY
              value: "500"
            - name: NETWORK_JITTER
              value: "100"
            - name: NETWORK_CORRELATION
              value: "25"
            - name: TARGET_CONTAINER
              value: ""
            - name: LABEL_SELECTOR
              value: "app.kubernetes.io/name in (go-service,node-service,frontend)"
            - name: NETWORK_INTERFACE
              value: "eth0"
---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: network-latency
  namespace: litmus
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["get", "list", "create", "patch", "update"]
    image: litmuschaos/go-runner:2.13.0
    imagePullPolicy: Always
    args:
      - -c
      - |
        #!/bin/bash
        set -e
        echo "Starting network-latency chaos experiment"
        echo "Latency: ${NETWORK_LATENCY}ms, Jitter: ${NETWORK_JITTER}ms, Correlation: ${NETWORK_CORRELATION}%"
        echo "Target: $LABEL_SELECTOR in namespace $TARGET_NAMESPACE"
        echo "Interface: ${NETWORK_INTERFACE}"

        # Get target pods
        PODS=$(kubectl get pods -n $TARGET_NAMESPACE -l $LABEL_SELECTOR -o jsonpath='{.items[*].metadata.name}')
        POD_COUNT=$(echo $PODS | wc -w)

        if [ $POD_COUNT -eq 0 ]; then
          echo "No pods found matching selector"
          exit 1
        fi

        echo "Found $POD_COUNT pods"

        # Apply tc (traffic control) to each pod
        for POD in $PODS; do
          CONTAINER=${TARGET_CONTAINER:-$(kubectl get pod $POD -n $TARGET_NAMESPACE -o jsonpath='{.spec.containers[0].name}')}
          echo "Applying latency to pod: $POD, container: $CONTAINER"

          kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            tc qdisc add dev ${NETWORK_INTERFACE} root netem \
            delay ${NETWORK_LATENCY}ms ${NETWORK_JITTER}ms distribution normal \
            correlation ${NETWORK_CORRELATION}% 2>/dev/null || \
            kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            tc qdisc change dev ${NETWORK_INTERFACE} root netem \
            delay ${NETWORK_LATENCY}ms ${NETWORK_JITTER}ms distribution normal \
            correlation ${NETWORK_CORRELATION}%
        done

        echo "Network latency applied. Waiting ${TOTAL_CHAOS_DURATION}s..."
        sleep ${TOTAL_CHAOS_DURATION}

        # Remove tc rules
        echo "Removing network latency..."
        for POD in $PODS; do
          CONTAINER=${TARGET_CONTAINER:-$(kubectl get pod $POD -n $TARGET_NAMESPACE -o jsonpath='{.spec.containers[0].name}')}
          echo "Cleaning up pod: $POD"
          kubectl exec -n $TARGET_NAMESPACE $POD -c $CONTAINER -- \
            tc qdisc del dev ${NETWORK_INTERFACE} root 2>/dev/null || true
        done

        echo "Network latency experiment completed"