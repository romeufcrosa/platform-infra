# Canonical worked example: Vault -> Kubernetes Secret
#
# THIS FILE IS THE CANONICAL COPY. `tofu/modules/vault/external-secrets-example.yaml`
# used to hold a second copy that no tool read; it is deleted, because two copies
# of one manifest drift and the unread one drifts silently.
#
# Read with scripts/seed-vault.sh (the writer) and scripts/check-secret-contract.sh
# (the guard that compares the two).
#
# WHY THIS IS NOT IN kubernetes/platform-system/, even though that is where a
# GitOps-synced object would normally go. Two reasons, and the second is the
# one that decides it.
#
# 1. The `platform-system` AppProject deliberately lists only the eight platform
#    namespaces in `spec.destinations` and omits `dev`, `staging` and `prod`.
#    `tofu/modules/argocd/bootstrap-appproject.yaml.tftpl` gives the reason: a
#    platform component permitted to write into a production namespace is a
#    production incident waiting for a mistyped path. ArgoCD validates a
#    resource's namespace against the AppProject, not against the Application's
#    destination, so this manifest could not be synced by that Application at
#    all — the first sync after it was added would have failed with
#    `namespace is not permitted`. (Asserted by reading the live AppProject;
#    NOT exercised through ArgoCD, because the commit was not pushed and
#    ArgoCD's `Synced Healthy` was a true statement about an older revision.)
#
# 2. More fundamentally, a service's ExternalSecret is owned by the service's
#    repository, not by the platform base. platform-system exists to deploy
#    platform components; `go-service-credentials` is not one. In a real company
#    this file arrives with the Go service, under an app-namespaced AppProject
#    written for that service — which is also the thing that keeps the
#    AppProject invariant above intact instead of eroding it one example at a
#    time.
#
# So this file is the Phase 2 template, parked where it is reviewable, applied
# by nothing. To try it locally:
#
#   kubectl --context platform apply -f examples/external-secrets/go-service-credentials.yaml
#
# It needs only the ClusterSecretStore (OpenTofu-owned) and a seeded Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-service-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: go-service-credentials
    creationPolicy: Owner
  data:
    # The `property:` line is REQUIRED and the brief omitted it. Without it,
    # `remoteRef` selects the WHOLE secret and External Secrets writes the
    # value as a JSON envelope of every key in the Vault entry. Observed on the
    # live cluster with the brief's exact manifest:
    #
    #   database-url = {"value":"postgres://platform:platform@postgres..."}
    #
    # A Go service doing `os.Getenv("DATABASE_URL")` gets a string starting
    # with `{` and fails at connect time with an error naming neither Vault nor
    # External Secrets. `scripts/seed-vault.sh` stores each value under a key
    # named after the path's leaf segment, so `property:` names that key and
    # the service receives the bare credential.
    - secretKey: database-url
      remoteRef:
        key: platform/go-service/database-url
        property: database-url
    - secretKey: jwt-secret
      remoteRef:
        key: platform/go-service/jwt-secret
        property: jwt-secret
    - secretKey: aws-access-key-id
      remoteRef:
        key: platform/go-service/aws-access-key-id
        property: aws-access-key-id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: platform/go-service/aws-secret-access-key
        property: aws-secret-access-key
