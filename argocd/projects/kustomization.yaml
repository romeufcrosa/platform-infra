---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field. Every AppProject already declares
# `namespace: argocd` in its own metadata, and the transformer would rewrite
# metadata.name on these cluster-scoped objects, not metadata.namespace.
resources:
  - platform-system.yaml
  - dev.yaml
  - staging.yaml
  - prod.yaml
  - node-services.yaml
