---
# Generated by OpenTofu (module argocd) — do not edit by hand; edit the
# .tftpl template instead. Regenerated on every apply so the repo and the
# cluster cannot drift.
#
# This file is NOT how the AppProject gets created. It is the same manifest
# as `kubernetes_manifest.app_project`, rendered a second time. The
# `kubernetes_manifest` is what creates the object; this file is what a human
# reads and what a future `kubectl apply` would use.
#
# The AppProject has to exist before the Application, and it is created here
# rather than synced by ArgoCD because the Application cannot sync anything
# until its project does. That is a boot-ordering fact, not a style choice:
# with the project missing, ArgoCD reports
#
#   InvalidSpecError: Application referencing project platform-system
#   which does not exist
#
# and the Application sits at SYNC STATUS Unknown / HEALTH STATUS Unknown
# forever, with no retry and no error in any pod log — it is a spec
# validation, not a crash.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  description: Platform components managed by OpenTofu and synced by ArgoCD
  # `*` for the Phase 1 repository, which is public. Narrowing this to the
  # single repo URL is a one-line change and belongs with the first private
  # repo — see docs/adr/0001-github-push-model.md.
  sourceRepos:
    - '*'
  destinations:
    - namespace: 'argocd'
      server: '*'
    - namespace: 'atlantis'
      server: '*'
    - namespace: 'ministack'
      server: '*'
    - namespace: 'vault'
      server: '*'
    - namespace: 'monitoring'
      server: '*'
    - namespace: 'registry'
      server: '*'
    - namespace: 'external-secrets'
      server: '*'
    - namespace: 'platform-system'
      server: '*'
  # The three application namespaces (dev, staging, prod) are deliberately
  # absent from `destinations`. They belong to their own projects, and a
  # platform component allowed to write into a production namespace is a
  # production incident waiting for a mistyped path.
  #
  # `clusterResourceWhitelist` is unrestricted, and that is a real widening: it
  # lets this project create Namespaces and CRDs anywhere in the cluster. It
  # is here because the platform-system base *contains* Namespace objects
  # (Task 4), and namespaced destinations do not govern cluster-scoped
  # resources. Narrowing it means moving the Namespace objects out of the
  # synced path first — the two changes are coupled, so neither goes alone.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
