---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: node-services
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Node.js services - development environment
  sourceRepos:
    - '*'
  destinations:
    - namespace: 'dev'
      server: '*'
    - namespace: 'node-services'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
