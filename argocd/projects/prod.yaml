apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Production environment - protected, manual promotion
  sourceRepos:
    - https://github.com/romeufcrosa/platform-infra.git
    - https://github.com/romeufcrosa/platform-services-go.git
    - https://github.com/romeufcrosa/platform-services-node.git
    - https://github.com/romeufcrosa/platform-frontend.git
  destinations:
    - namespace: 'prod'
      server: '*'
  clusterResourceWhitelist:
    - group: 'argoproj.io'
      kind: 'Application'
    - group: 'argoproj.io'
      kind: 'ApplicationSet'
    - group: 'cert-manager.io'
      kind: 'ClusterIssuer'
    - group: 'external-secrets.io'
      kind: 'ClusterSecretStore'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: admin
      description: Platform leads full access to production
      policies:
        - p, proj:prod:admin, applications, *, prod/*, allow
        - p, proj:prod:admin, repositories, *, *, allow
        - p, proj:prod:admin, clusters, *, *, allow
        - p, proj:prod:admin, projects, *, *, allow
      groups:
        - platform-leads
    - name: read-only
      description: Platform team read-only access to production
      policies:
        - p, proj:prod:read-only, applications, get, prod/*, allow
        - p, proj:prod:read-only, applications, list, prod/*, allow
        - p, proj:prod:read-only, repositories, get, *, allow
        - p, proj:prod:read-only, clusters, get, *, allow
      groups:
        - platform-team
  syncWindows:
    - kind: allow
      schedule: '0 2 * * 0'  # Weekly Sunday 02:00 UTC
      duration: 4h
      applications:
        - '*'
    - kind: deny
      schedule: '0 6 * * 0'  # Weekly Sunday 06:00 UTC (end of window)
      duration: 164h
      applications:
        - '*'