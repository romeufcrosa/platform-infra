apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: prod
  source:
    repoURL: https://github.com/romeufcrosa/platform-frontend.git
    targetRevision: main
    path: helm/frontend
    helm:
      valueFiles:
        - values-prod.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true