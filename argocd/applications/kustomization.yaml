apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field, for the same reason as argocd/projects: the
# transformer rewrites metadata.name, and the Application already declares
# `namespace: argocd` itself.
resources:
  - platform-system.yaml
  - go-service-dev.yaml
  - node-service-dev.yaml
  - frontend-dev.yaml
  - go-service-staging.yaml
  - node-service-staging.yaml
  - frontend-staging.yaml
  - go-service-prod.yaml
  - node-service-prod.yaml
  - frontend-prod.yaml
  - ../applicationset/services-applicationset.yaml
