apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-service-dev
  namespace: argocd
spec:
  project: node-services
  source:
    repoURL: https://github.com/romeufcrosa/platform-services-node.git
    targetRevision: main
    path: helm/node-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
