---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-service-dev
  namespace: argocd
spec:
  project: dev
  source:
    repoURL: https://github.com/romeufcrosa/platform-services-go.git
    targetRevision: main
    path: helm/go-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
