# Reference definition. Task 9 applies this after Vault is unsealed and has
# a policy allowing the platform path. Kept in-tree so the store's shape is
# reviewable in a PR rather than only visible in cluster state.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-certs
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "platform-external-secrets"
          serviceAccountRef:
            name: "external-secrets-vault"
