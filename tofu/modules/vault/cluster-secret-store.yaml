# The real ClusterSecretStore, applied by `kubernetes_manifest` in this module.
# This is the ONLY ClusterSecretStore named `vault` that is applied anywhere.
# The reference copy that used to live in
# `tofu/modules/external_secrets/cluster-secret-store.yaml` was deleted so that
# exactly one exists.
#
# THE `tokenSecretRef` KEY IS NOT `token.secretRef`, and the brief was wrong
# about it. The brief's Step 5 wrote:
#
#     auth:
#       token:
#         secretRef: {name: ..., key: token}
#
# There is no `token` key under `provider.vault.auth` in this API. Read off the
# live CRD (external-secrets 0.9.11), not from the chart's docs:
#
#   kubectl --context platform get crd clustersecretstores.external-secrets.io \
#     -o json | python3 -c '...print(sorted(auth["properties"]))'
#   -> ['appRole', 'cert', 'iam', 'jwt', 'kubernetes', 'ldap',
#       'tokenSecretRef', 'userPass']
#
# `tokenSecretRef` is the token-based auth method, and it takes `name`, `key`
# and `namespace` directly — it is a reference, not a wrapper with a `secretRef`
# under it. The brief's shape would have been accepted by `kubectl apply` and
# then silently ignored by the operator, which is the same silent no-op class
# the helm values file guards against; `kubernetes_manifest` caught it at PLAN
# time instead, which is the entire reason this object is declared as a
# manifest rather than in a post-apply `kubectl` call:
#
#   Error: Manifest configuration incompatible with resource schema
#   Unable to find schema type for attribute:
#   object.spec.provider.vault.auth.token
#
# `namespace` is REQUIRED IN PRACTICE, and an earlier draft of this file
# omitted it on the strength of the CRD's field description:
#
#   "Namespace of the resource being referred to. Ignored if referent is not
#    cluster-scoped. cluster-scoped defaults to the namespace of the referent."
#
# That reads as "a ClusterSecretStore is cluster-scoped, so the namespace
# defaults and you can leave it out". It is true and it is useless: the
# *referent* here is the ClusterSecretStore, which has no namespace of its own
# to inherit, so the operator falls back to the namespace of the ExternalSecret
# doing the reading — which is `dev`. The creds Secret lives in
# `external-secrets`. With the field omitted the ExternalSecret sat at
# `Ready=False reason=SecretSyncedError` and the operator log said, in full:
#
#   error retrieving secret at .data[0], key: platform/go-service/database-url,
#   err: cannot get Kubernetes secret "external-secrets-vault-creds":
#   secrets "external-secrets-vault-creds" not found
#
# Note what that message does NOT say: it names the right Secret, so the
# failure reads like a missing object rather than a missing namespace, and the
# object is right there. The store itself still reported `Ready=True` the whole
# time, because validating the store only checks the Vault connection — it does
# not resolve the token reference. A green store is not a green pipeline.
#
# So: `namespace` is pinned to `external-secrets`, where
# `kubernetes_secret.vault_creds` actually creates the object. That is the whole
# contract between the two resources and it is now written down in both files.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # The token-based auth block is what the local profile uses. The
        # Kubernetes-native block is the production target and is kept in
        # cluster-secret-store.production.yaml for comparison.
        #
        # NOTE: the Kubernetes variant lives under `auth.kubernetes`, which IS a
        # real key (see the sorted list in the header comment) — so the brief's
        # claim that the production copy's shape is `auth.kubernetes` is
        # correct, and it is only the token block that was wrong.
        tokenSecretRef:
          name: external-secrets-vault-creds
          key: token
          namespace: external-secrets
