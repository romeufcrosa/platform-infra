# TARGET STATE — NOT APPLIED LOCALLY.
#
# This file is the production posture for the Vault-backed ClusterSecretStore
# and it is deliberately NOT wired to any OpenTofu resource. Nothing reads it;
# `make validate` does not render it; `tofu plan` will never mention it. It is
# in the tree so that the two auth models can be compared in a pull request
# rather than reconstructed from memory six months from now.
#
# THE DIFFERENCE, IN ONE LINE: the local store authenticates with a long-lived
# root token that a human generated and wrote to a file; this one authenticates
# with a short-lived, audience-bound JWT that Vault mints on the strength of the
# caller's ServiceAccount token. Everything else in the file is the same.
#
# What the token costs, concretely, because that is the argument for doing this
# eventually:
#
#   * The local root token never expires and cannot be scoped. Anything that
#     can read `local-secrets/vault-root-token` is root at Vault, forever, and
#     revoking it means re-issuing it and re-applying the secret.
#   * It is a static credential checked into no Git but still living on a
#     laptop disk in plaintext, and it must be readable by the External Secrets
#     Operator pod, so it is a Secret in the cluster that anyone with
#     `get secret -n external-secrets` can read.
#   * There is no `kubernetes/` auth method configured on the local Vault at
#     all, because `vault server -dev` enables only a dev-appropriate set of
#     auth methods. The Vault side of this file does not exist yet in the local
#     profile and cannot be added by editing YAML.
#
# To adopt this, in order:
#   1. Replace `server.dev` with a real storage backend and a real HA topology
#      (see docs/runbooks/vault-secrets.md). Everything below is meaningless on
#      a dev-mode Vault.
#   2. Enable the `kubernetes` auth method, create the `platform-external-secrets`
#      role bound to the `external-secrets` namespace's ServiceAccounts, and set
#      its `bound_service_account_names` / `bound_service_account_namespaces` /
#      `token_policies`. This is Vault state, not Kubernetes state.
#   3. Create the `external-secrets-vault` ServiceAccount in the
#      `external-secrets` namespace (OpenTofu — one owner, as with every other
#      object).
#   4. Point the operator at it with `spec.tokenAuth` / the `serviceAccountRef`
#      on the ClusterSecretStore's provider, and delete the
#      `external-secrets-vault-creds` Secret — which is the moment
#      `kubernetes_secret.vault_creds` must be removed from
#      `tofu/modules/vault/main.tf` in the same commit, or the two fight.
#
# The `caProvider` block below is also absent from the local file on purpose:
# the local Vault serves plain HTTP inside the cluster, so there is no CA to
# trust. It comes back the moment Vault is fronted by TLS.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-certs
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "platform-external-secrets"
          serviceAccountRef:
            name: "external-secrets-vault"
