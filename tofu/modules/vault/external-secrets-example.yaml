# A worked example of the full path Vault -> Kubernetes Secret. It creates
# real credentials in a real namespace, so it doubles as the Phase 2
# template. Phase 2 copies this per service and per environment.
#
# It is a real object, not a `# example` block: the ExternalSecret in
# `kubernetes/platform-system/platform/vault.yaml` is a copy of this file's
# spec, and that one is the thing that makes Step 8's assertion — the
# ClusterSecretStore reports `Ready=True` and the secret in `dev` contains four
# base64 keys — a statement about the pipeline rather than about a pod.
#
# NOTE: only the ExternalSecret lands in the synced GitOps base. The
# ClusterSecretStore it points at does NOT, and must not: OpenTofu applies that
# as `kubernetes_manifest.cluster_secret_store`, and a synced twin would give
# one object two owners. See kubernetes/platform-system/platform/vault.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-service-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: go-service-credentials
    creationPolicy: Owner
  data:
    # `property:` names the key inside the Vault entry. Without it `remoteRef`
    # selects the whole secret and External Secrets writes a JSON envelope of
    # every key into the Kubernetes Secret — observed live as
    # `{"value":"postgres://..."}` rather than the DSN. See the longer note in
    # kubernetes/platform-system/platform/vault.yaml and the kv_put comment in
    # scripts/seed-vault.sh.
    - secretKey: database-url
      remoteRef:
        key: platform/go-service/database-url
        property: database-url
    - secretKey: jwt-secret
      remoteRef:
        key: platform/go-service/jwt-secret
        property: jwt-secret
    - secretKey: aws-access-key-id
      remoteRef:
        key: platform/go-service/aws-access-key-id
        property: aws-access-key-id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: platform/go-service/aws-secret-access-key
        property: aws-secret-access-key
