---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-iac:
    name: Validate IaC and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.7.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: tofu fmt check
        run: tofu -chdir=tofu fmt -check -recursive

      - name: tofu init (backend disabled, no cluster needed)
        run: tofu -chdir=tofu init -backend=false -input=false

      - name: tofu validate
        run: tofu -chdir=tofu validate

      - name: Lint Kustomize builds
        run: |
          set -euo pipefail
          kubectl kustomize kubernetes/platform-system > /dev/null
          kubectl kustomize argocd > /dev/null

      - name: Lint YAML
        run: yamllint -c .yamllint.yaml .

  validate-helm:
    name: Validate Helm values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - name: Add Helm repositories
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          # charts.runatlantis.io (the URL in the Task 5 brief) does not
          # resolve — DNS NXDOMAIN, not a 404. The live repository is
          # https://runatlantis.github.io/helm-charts, and it serves the chart
          # as runatlantis/atlantis. Verified 2026-09-27.
          helm repo add runatlantis https://runatlantis.github.io/helm-charts
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Template every chart with its values
        run: |
          set -euo pipefail
          # chart-ref and values-file are kept adjacent so adding a component
          # in a later task means adding one line here, in the same commit.
          #
          # Ministack is deliberately absent: it has no Helm chart (Task 7) and
          # no values file, so there is nothing to `helm repo add` or
          # `helm template`. Its YAML is covered by the yamllint and kustomize
          # jobs instead, which is the whole validation story for a component
          # declared as plain manifests. Adding a `ministack` line back here
          # would fail CI with a repository-not-found error, because the
          # repository genuinely does not exist.
          failed=""
          while read -r name chart; do
            printf -- '--- %s --- ' "$name"
            if helm template "$name" "$chart" -f "helm/values/$name.yaml" >/dev/null 2>&1; then
              echo OK
            else
              echo FAILED
              failed="$failed $name"
            fi
          done <<'EOF'
          argocd argo/argo-cd
          atlantis runatlantis/atlantis
          vault hashicorp/vault
          prometheus prometheus-community/kube-prometheus-stack
          EOF
          # A failure is collected and reported at the end rather than relying
          # on errexit inside the loop, and the exit code is set explicitly.
          # `set -e` around a `while read` body is easy to reason about wrongly;
          # the list of what failed is useful on its own.
          test -z "$failed" || { echo "helm template failed for:$failed"; exit 1; }

  scan:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # The tag is v0.28.0. The bare `0.28.0` in the Task 5 brief is not a tag
      # in this repository (GitHub API 404); the release list carries a `v`
      # prefix for 0.28.0. Verified 2026-09-27.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
