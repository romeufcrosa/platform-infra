---
# Production environment values override for platform-infra
# This file contains global/platform-level configuration for production

# Global image tag for production
global:
  imageTag: "prod"
  environment: "prod"

# ArgoCD production configuration
argocd:
  server:
    replicas: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Max
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/rate-limit: "50"
        nginx.ingress.kubernetes.io/rate-limit-window: "1m"
        nginx.ingress.kubernetes.io/limit-connections: "20"
        nginx.ingress.kubernetes.io/enable-modsecurity: "true"
        nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
      hosts:
        - argocd.example.com
      tls:
        - secretName: argocd-prod-tls
          hosts:
            - argocd.example.com
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-server
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - argocd-server
              topologyKey: topology.kubernetes.io/zone

  applicationSet:
    enabled: true

  dex:
    enabled: false

  notifications:
    enabled: false

  configs:
    cm:
      application.resourceTrackingMethod: annotation

# Prometheus/Grafana production configuration
prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 3
    config:
      route:
        receiver: "null"
        group_by:
          - alertname
          - namespace
      receivers:
        - name: "null"
  grafana:
    enabled: true
    adminUser: admin
    adminPassword: ""
    fullnameOverride: grafana
    persistence:
      enabled: true
      size: 10Gi
    serviceMonitor:
      enabled: true
    sidecar:
      datasources:
        enabled: true
        defaultDatasourceEnabled: false
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - grafana
            topologyKey: kubernetes.io/hostname
  prometheus:
    prometheusSpec:
      retentionSize: 50GB
      resources:
        requests:
          cpu: 1000m
          memory: 4Gi
        limits:
          memory: 8Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      podMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podDisruptionBudget:
        enabled: true
        minAvailable: "50%"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - prometheus
              topologyKey: kubernetes.io/hostname
    serviceMonitor:
      selfMonitor: true
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"

# Default rules for production
defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

# Vault production configuration
vault:
  server:
    replicas: 3
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    ha:
      enabled: true
      replicas: 3
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/rate-limit: "20"
        nginx.ingress.kubernetes.io/rate-limit-window: "1m"
        nginx.ingress.kubernetes.io/limit-connections: "10"
        nginx.ingress.kubernetes.io/enable-modsecurity: "true"
        nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
      hosts:
        - vault.example.com
      tls:
        - secretName: vault-prod-tls
          hosts:
            - vault.example.com
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vault
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - vault
              topologyKey: topology.kubernetes.io/zone

# Atlantis production configuration
atlantis:
  replicas: 3
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rate-limit: "20"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
      nginx.ingress.kubernetes.io/limit-connections: "10"
      nginx.ingress.kubernetes.io/enable-modsecurity: "true"
      nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    hosts:
      - atlantis.example.com
    tls:
      - secretName: atlantis-prod-tls
        hosts:
          - atlantis.example.com
  podDisruptionBudget:
    enabled: true
    minAvailable: "50%"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - atlantis
          topologyKey: kubernetes.io/hostname

# PostgreSQL production configuration
postgresql:
  primary:
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    persistence:
      size: 100Gi
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - postgresql
            topologyKey: kubernetes.io/hostname
  pgbouncer:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: "50%"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - pgbouncer
            topologyKey: kubernetes.io/hostname
