apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: there is deliberately NO `namespace:` field here, and no
# `commonLabels:`/`managed-by: argocd`. Both were in the Task 5 brief and both
# are wrong against the real cluster; see the report.
#
#   * `namespace: platform-system` rewrites metadata.name on a Namespace
#     object. Verified with kustomize v5.0.4 (bundled in kubectl 1.30.2): a
#     base with `namespace: platform-system` and two Namespace resources
#     fails outright with "namespace transformation produces ID conflict",
#     because every Namespace is rewritten to the same name. This base
#     declares five of them.
#   * `commonLabels: {app.kubernetes.io/managed-by: argocd}` overwrites the
#     `managed-by: opentofu` that OpenTofu (Task 4) puts on all eleven
#     namespaces. Verified: kustomize replaces an existing label value, it
#     does not merge. ArgoCD would then own the label and OpenTofu would
#     fight it on the next apply — a permanent diff in both directions.
#
# Each component manifest therefore declares its own namespace and its own
# labels. The base still stamps `part-of` on everything, because that value is
# identical on every resource in the repo and cannot drift.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: platform-learning-ecosystem

# RULE R29b: an object may be declared in exactly ONE place. OpenTofu owns
# all eleven namespaces (Global Constraint), so NO Namespace document appears in
# this base. namespace.yaml was here and is now a tombstone; the two Namespace
# documents that were inline in platform/external-secrets.yaml are gone too.
#
# Why this is not merely tidy. A Namespace in this base has two owners:
# module.namespaces creates it, and ArgoCD syncs it with prune:true. That is
# the reconcile loop this project already hit once. Separately, dev/staging/prod
# had never been synced at all, so they sat in the path owned by nobody until the
# first push. Both problems are the same problem, and removing the objects
# removes both.
resources:
  - platform/ministack.yaml
  # Task 8 adds exactly one file, and the reason it is safe here is not "it is
  # a config file" — it is that nothing else declares
  # `observability-grafana-datasource`. The registry's GitOps copy lives in
  # kubernetes/registry/, which NO Application points at, because the
  # kubernetes_deployment / kubernetes_service in tofu/modules/registry/ are the
  # live objects and a synced twin would be a second owner.
  - platform/prometheus.yaml
  # Task 9. A TOMBSTONE: zero documents, like platform/ministack.yaml and
  # platform/external-secrets.yaml. All of Vault's objects are OpenTofu-owned.
  #
  # It is listed rather than omitted, matching platform/ministack.yaml (Task 7).
  # The repo is genuinely inconsistent here — ministack.yaml is listed,
  # external-secrets.yaml is not, and both are zero-document tombstones — so
  # this picks the convention that keeps a tombstone reachable from the base
  # that owns it. `kubectl kustomize` tolerates a zero-document file: verified
  # by temporarily adding platform/external-secrets.yaml to resources and
  # building, exit 0. Listing it also means deleting the file is a visible
  # kustomize error rather than a silent loss of its explanation.
  - platform/vault.yaml
  # Each component task appends its manifest here:
  #   platform/ministack.yaml     (Task 7) ✓ appended below
  #   platform/vault.yaml         (Task 9) ✓ appended below (tombstone)
