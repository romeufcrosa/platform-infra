# Generated by scripts/render-dashboards.sh — do not edit by hand.
# Source of truth is dashboards/*.json. Run `make dashboards` after any
# dashboard change and commit the result.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-go-service-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platform-learning-ecosystem
  annotations:
    grafana_folder: "Platform"
data:
  go-service-golden-signals.json: |-
    {
      "panels": [
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"go-service\"}[5m])) by (method, path)",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "title": "Traffic (requests per second)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"go-service\", status=~\"5..\"}[5m])) by (path)",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ],
          "title": "Errors (error requests per second)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"go-service\"}[5m])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Latency p50 (seconds)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"go-service\"}[5m])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Latency p99 (seconds)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "options": {
            "colorMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"dev\", pod=~\"go-service.*\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Saturation (CPU usage)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "Metric depends on Ministack version and may need an exporter; do not claim it works until verified.",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "options": {
            "colorMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(ministack_queue_approximate_number_of_messages{queue=\"order-events\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "SQS Depth (order-events queue)",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Go Service Golden Signals",
      "uid": "go-service-golden-signals",
      "version": 1
    }
