apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platform-learning-ecosystem
  annotations:
    grafana_folder: "Platform"
data:
  slo-dashboard.json: |-
    {
      "panels": [
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "thresholds": "0.999"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"go-service\", status!~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"go-service\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Availability SLO",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "thresholds": "0.5"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"go-service\"}[5m])) by (le))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Latency SLO",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "thresholds": "0"
          },
          "targets": [
            {
              "expr": "1 - ((1 - (sum(rate(http_requests_total{job=\"go-service\", status!~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"go-service\"}[5m])))) / (1 - 0.999))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Error budget remaining",
          "type": "stat"
        },
        {
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "options": {
            "content": "Availability SLO: Percentage of successful requests (status < 500) over total requests.\nLatency SLO: Percentage of requests under 500ms latency threshold.\nError budget remaining: 1 - (error_ratio / (1 - SLO_target)). Red when error budget is depleted.",
            "mode": "markdown"
          },
          "title": "SLO Explanation",
          "type": "text"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "SLO Dashboard",
      "uid": "slo-dashboard",
      "version": 1
    }
