---
# Vault HAS NO DOCUMENTS IN THIS FILE, AND THAT IS RULE R29b.
#
# R29b: an object may be declared in exactly ONE place. ArgoCD syncs this base
# with `recurse: true`, `prune: true` and `selfHeal: true`, so anything
# declared here AND in an OpenTofu module is a reconcile loop: ArgoCD reverts
# OpenTofu's change, OpenTofu's next apply reverts ArgoCD's, and `tofu plan`
# reports clean the entire time because neither tool is wrong about its own
# copy of the desired state. That is the same defect `platform/ministack.yaml`
# and `platform/external-secrets.yaml` are tombstones for.
#
# WHERE THE VAULT OBJECTS LIVE INSTEAD:
#
#   StatefulSet/vault      Helm release, hashicorp/vault 0.28.0
#                          tofu/modules/vault/main.tf
#                          helm_release.vault -> `statefulset/vault`
#   Service/vault          same release (plus vault-internal, vault-ui)
#   ServiceAccount/vault   same release
#   ClusterSecretStore/vault        tofu/modules/vault/main.tf
#                          kubernetes_manifest.cluster_secret_store
#   Secret/external-secrets-vault-creds
#                          tofu/modules/vault/main.tf
#                          kubernetes_secret.vault_creds
#
# Confirmed against the live cluster after this task's apply, not inferred:
# `kubectl --context platform -n vault get all` shows the StatefulSet, the
# three Services and the ServiceAccount, and none of them carry an
# `argocd.argoproj.io/tracking-id` annotation — which is the property that
# makes this safe. ArgoCD's prune only ever considers objects it has claimed,
# and it has claimed none of these.
#
# WHY THIS FILE IS A TOMBSTONE AND NOT JUST A STUB. It is kept rather than
# deleted because a reader who finds a platform-system base with no Vault
# component in it would reasonably assume Vault was never deployed. The absence
# is the finding, and it should be legible without reconstructing the history.
#
# AND WHERE THE ExternalSecret WENT. An earlier draft of this file carried the
# `ExternalSecret/go-service-credentials` as a live document, on the argument
# that it had only one owner because no OpenTofu resource applied it. That was
# true and it was still the wrong place. The `platform-system` AppProject
# lists eight platform namespaces in `spec.destinations` and deliberately omits
# `dev`, `staging` and `prod` — see the comment on
# `tofu/modules/argocd/bootstrap-appproject.yaml.tftpl` — and ArgoCD validates
# a resource's namespace against the AppProject, not against the Application's
# destination. The first sync would have failed with
# `namespace is not permitted`.
#
# Widening that invariant to accommodate one example file would have been the
# wrong trade: a platform component allowed to write into a production namespace
# is a production incident waiting for a mistyped path. A service's
# ExternalSecret is owned by the service's repository, not by the platform base.
# It is now at:
#
#   examples/external-secrets/go-service-credentials.yaml
#
# which is applied by nothing and synced by nothing, and which Phase 2 copies
# into each service repo under an app-namespaced AppProject. It is the canonical
# copy; the duplicate that used to sit in `tofu/modules/vault/` is deleted.
#
# The drift guard the original placement was meant to provide is real and now
# lives where both ends can see it:
# `scripts/check-secret-contract.sh` compares the paths and leaf keys written by
# `scripts/seed-vault.sh` against this example's `remoteRef.key` /
# `remoteRef.property` pairs. A renamed path fails the check instead of
# producing an ExternalSecret that silently stops refreshing.
#
# When Phase 2 hands this base to ArgoCD for the workload too, ownership has to
# change deliberately, once, in review, in a commit that says so, with the
# OpenTofu resources removed in the same change.
