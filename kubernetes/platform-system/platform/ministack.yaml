# Ministack has NO DOCUMENTS IN THIS FILE, AND THAT IS RULE R29.
#
# R29: in Phase 1, OpenTofu owns every object in kubernetes/platform-system/.
# The synced base carries Namespaces and component CRD instances, and no
# workload objects.
#
# Why the rule exists. Before it, the Ministack Deployment and Service were
# declared in BOTH this file and tofu/modules/ministack/main.tf. The queue
# bootstrap Job had the same duplication and was removed from this file in fix
# round 1. All three were one object with two owners.
#
# The failure mode is specific and worth naming, because nothing reports it.
# ArgoCD's `selfHeal: true` reverts OpenTofu's change, and OpenTofu's next
# `apply` reverts ArgoCD's. `tofu plan` reports clean the entire time, because
# neither tool is wrong about its own copy of the desired state — each one is
# faithfully converging on what it was told. The only visible symptom is a
# workload that silently undoes a configuration change, some minutes after
# somebody made it, with a green plan sitting in the middle of the evidence.
#
# ArgoCD would also have pruned these objects on the sync that followed this
# change, had it ever adopted them. It had not, and the reason is worth
# recording: the OpenTofu-managed objects carry no
# `argocd.argoproj.io/tracking-id` annotation, so ArgoCD's prune only ever
# considers objects it has claimed. Verified 2026-09-30 against the live
# cluster, where the Deployment's annotations are exactly
# `{"deployment.kubernetes.io/revision":"1"}`. That is the property that makes
# this deletion safe, and it is a property of WHO CREATED THE OBJECT, not of
# this file. Re-adding a workload here would hand ArgoCD a claim it does not
# currently have.
#
# WHERE THE OBJECTS LIVE INSTEAD:
#
#   Deployment        tofu/modules/ministack/main.tf
#                     kubernetes_deployment.ministack
#   Service           tofu/modules/ministack/main.tf
#                     kubernetes_service.endpoint
#   ServiceAccount    tofu/modules/ministack/main.tf
#                     kubernetes_service_account.bootstrap
#   bootstrap Job     tofu/modules/ministack/main.tf
#                     kubernetes_job.bootstrap, running
#                     tofu/modules/ministack/bootstrap-ministack-queues.sh
#                     mounted as a ConfigMap
#
# There is no `helm_release` for any of them and no `helm/values/ministack.yaml`
# for the same reason as before: no Helm chart for Ministack is published
# anywhere. `https://ministack.github.io/ministack-helm/index.yaml` returns
# 404. Verified 2026-09-30.
#
# This file is kept, rather than deleted, because a reader who finds a
# platform-system base with no Ministack component in it would reasonably
# assume the component was never deployed. The absence is the finding; it
# should be legible without having to reconstruct the history.
#
# When Phase 2 hands this base to ArgoCD, this file is where the workload comes
# back — and at that point ownership has to change deliberately, once, in
# review, in a commit that says so, with the OpenTofu resources removed in the
# same change. Not as a side effect of whoever pushes second.
