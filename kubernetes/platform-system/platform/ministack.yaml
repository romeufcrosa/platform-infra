# Managed by OpenTofu in the local profile. This manifest mirrors
# tofu/modules/ministack/main.tf, which is what actually creates these objects
# in Phase 1. In Phase 2+ ArgoCD becomes authoritative and this file is the one
# it applies. Change both together.
#
# NOTE ON THE BRIEF'S NAMESPACE WARNING: it predicted that the kustomization's
# `namespace: platform-system` would rewrite `namespace: ministack` on the two
# objects below and split the Deployment from where `tofu apply` puts it. That
# prediction is already obsolete — Task 5 removed the `namespace:` field, and
# this base has no namespace transformer at all. Verified by rendering rather
# than by reading the file:
#
#   $ kubectl kustomize kubernetes/platform-system | grep -n 'namespace:'
#   ...  namespace: external-secrets
#   ...  namespace: ministack
#   ...  namespace: platform-system
#
# Each object below keeps its own namespace. The concern for Phase 2 is real
# but is now a different one: if `namespace:` is ever re-added to the
# kustomization, this file breaks again. See the kustomization.yaml header.
#
# Ministack has no Helm chart — `https://ministack.github.io/ministack-helm`
# returns 404 and no chart is published anywhere. Verified 2026-09-28.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: ministack
  labels:
    app.kubernetes.io/name: ministack
    app.kubernetes.io/part-of: platform-learning-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ministack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack
        app.kubernetes.io/part-of: platform-learning-ecosystem
    spec:
      containers:
        - name: ministack
          # Pinned (Global Constraint). Verified present on Docker Hub
          # 2026-09-28 with linux/amd64 and linux/arm64 manifests. The tag
          # comes from var.ministack_image via var.image_tag on the OpenTofu
          # side; this literal is the GitOps copy of the same pin and the two
          # must agree.
          image: ministackorg/ministack:1.5.17
          ports:
            # 4566 is Ministack's only port: S3, SQS and Secrets Manager all
            # arrive on this one gateway.
            - name: gateway
              containerPort: 4566
          readinessProbe:
            # Both paths verified 200 against the pinned image.
            httpGet:
              path: /_ministack/health
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ministack
  namespace: ministack
  labels:
    app.kubernetes.io/name: ministack
    app.kubernetes.io/part-of: platform-learning-ecosystem
spec:
  # ClusterIP, not NodePort: the host reaches it through `make port-forwards`,
  # and the queue bootstrap Job reaches it in-cluster at
  # http://ministack.ministack.svc.cluster.local:4566.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ministack
  ports:
    - name: gateway
      port: 4566
      targetPort: 4566
---
# The queue bootstrap Job runs in platform-system, not in the ministack
# namespace, so its ServiceAccount is here too. See main.tf for the reasoning.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ministack-bootstrap
  namespace: platform-system
  labels:
    app.kubernetes.io/part-of: platform-learning-ecosystem
# There is deliberately NO Role/RoleBinding. The brief asks for an "sqs:*"
# grant, but Kubernetes RBAC cannot gate this Job: it reaches Ministack over
# plain HTTP with the AWS CLI and makes no IAM call, so there is nothing for a
# Role to authorise. Verified 2026-09-28 — create-queue, list-queues, S3
# Put/GetObject and Secrets Manager Create/GetSecretValue all succeed with
# fake credentials and no IAM check. A wildcard grant here would look like
# security while doing nothing.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ministack-bootstrap
  namespace: platform-system
  labels:
    app.kubernetes.io/name: ministack
    app.kubernetes.io/part-of: platform-learning-ecosystem
spec:
  backoffLimit: 6
  # The Job deletes itself an hour after completing; OpenTofu recreates it on
  # the next apply, which re-runs the idempotent ensure loop below.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ministack-bootstrap
      containers:
        - name: aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:2.17.0   # pinned
          # The AWS CLI requires BOTH a region and credentials and errors out
          # without them. A pod has no ~/.aws and no IRSA, so the brief's
          # version of this Job — which set neither — failed every `aws` call
          # and then printed "queue <name> already exists" three times via its
          # `|| echo` fallback, having created nothing. Verified 2026-09-28
          # inside this exact image; the three values are standard emulator
          # placeholders, not secrets.
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_PAGER
              value: ""
          # `curl` is confirmed present in this image (verified 2026-09-28,
          # /usr/bin/curl 8.3.0), so the wait loop needs no second image.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              EP="http://ministack.ministack.svc.cluster.local:4566"
              echo "waiting for $EP"
              until curl -sf "$EP/_ministack/health" >/dev/null 2>&1; do
                sleep 2
              done
              for q in order-events order-events-dlq platform-notifications; do
                echo "ensuring queue: $q"
                aws --endpoint-url "$EP" sqs create-queue --queue-name "$q" \
                  --attributes VisibilityTimeout=30 || \
                  echo "queue $q already exists"
              done
              aws --endpoint-url "$EP" sqs list-queues
