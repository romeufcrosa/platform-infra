# Managed by OpenTofu in the local profile. This manifest exists so the
# GitOps path (ArgoCD) and the imperative path (tofu apply) converge on the
# same desired state; in Phase 2+ ArgoCD becomes authoritative and this file
# is the one ArgoCD applies.
#
# The label set below must mirror what `module "namespaces"` applies in
# tofu/main.tf, or ArgoCD's sync strips the difference and the cluster drifts
# into a permanent diff. Three labels are declared here and are managed by
# OpenTofu; the fourth, `kubernetes.io/metadata.name`, is added by the
# apiserver automatically and is deliberately absent. A change to
# `local.common_labels` in tofu/main.tf must be mirrored here in the same
# commit.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: platform-learning-ecosystem
    app.kubernetes.io/managed-by: opentofu
    platform.environment: local
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: platform-learning-ecosystem
    app.kubernetes.io/managed-by: opentofu
    platform.environment: local
