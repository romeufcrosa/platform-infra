# External Secrets Operator has NO DOCUMENTS IN THIS FILE, AND THAT IS RULE R29b.
#
# R29b: an object may be declared in exactly one place. Task 4 moved the
# `SecretStore` and `ExternalSecret` objects into `tofu/modules/external_secrets/`
# and made them OpenTofu-owned, because one object with two owners is the defect
# class this repo has fought repeatedly. ArgoCD syncs this base with `prune: true`
# and `selfHeal: true`, so anything declared here AND in the module is a
# reconcile loop: ArgoCD reverts OpenTofu's change, OpenTofu's next apply reverts
# ArgoCD's, and `tofu plan` reports clean the entire time because neither tool is
# wrong about its own copy.
#
# This file previously held two Namespace documents (external-secrets and
# platform-system). Those are gone because `module.namespaces` creates all eleven
# namespaces and OpenTofu owns them; see the note in ../kustomization.yaml.
#
# The handover copy, when Phase 2 makes ArgoCD authoritative for this base, is
# written by the task that performs the handover — deliberately not now, because
# a synced twin created before its handover is the exact defect described above.
